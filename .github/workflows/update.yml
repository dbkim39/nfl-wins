name: Refresh NFL Standings

on:
  schedule:
    # Sunday ~4:30 PM EST (21:30 UTC Sunday) - Post Early Games
    - cron: '30 21 * * 0'
    
    # Sunday ~8:00 PM EST (01:00 UTC Monday) - Post Late Afternoon Games
    - cron: '0 1 * * 1'
    
    # Sunday ~11:45 PM EST (04:45 UTC Monday) - Post Sunday Night Football
    - cron: '45 4 * * 1'
    
    # Tuesday ~4:00 AM EST (09:00 UTC Tuesday) - Post Monday Night Football final stats
    - cron: '0 9 * * 2'

  # Allows manual triggering from the GitHub web UI or mobile app anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and process standings
        env:
          SPORTSDATA_KEY: ${{ secrets.SPORTSDATA_KEY }}
        run: |
          chmod +x update_standings.sh
          ./update_standings.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl.js index.html 2026.html alarm2026.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated standings update" && git push)
