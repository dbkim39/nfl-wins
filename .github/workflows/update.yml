name: Refresh NFL Standings

on:
  # Triggered by cron-job.org via the API, or manually from the web UI or mobile app
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch and process standings
        env:
          SPORTSDATA_KEY: ${{ secrets.SPORTSDATA_KEY }}
        run: |
          chmod +x update_standings.sh
          ./update_standings.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl.js index.html 2026.html alarm2026.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated standings update" && git push)
