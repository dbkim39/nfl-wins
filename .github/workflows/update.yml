name: Refresh NFL Standings

on:
  schedule:
    # test
    - cron: '35 12 6 11 *'
    # Sunday 4:47 PM ET
    - cron: '47 21 * * 0'
    # Sunday 8:07 PM ET
    - cron: '07 1 * * 1'
    # 2:07 AM ET on Monday, Tuesday, and Friday
    - cron: '7 7 * * 1,2,5'
  # Allows manual triggering from the GitHub web UI or mobile app anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Fetch and process standings
        env:
          SPORTSDATA_KEY: ${{ secrets.SPORTSDATA_KEY }}
        run: |
          chmod +x update_standings.sh
          ./update_standings.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl.js index.html 2026.html alarm2026.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated standings update" && git push)
