name: Refresh NFL Standings

on:
  schedule:
    # Sunday 5:00 PM ET
    - cron: '0 22 * * 0'
    # Sunday 8:30 PM ET (01:30 UTC Monday)
    - cron: '30 1 * * 1'
    # 3:00 AM ET on Monday, Tuesday, and Friday
    - cron: '0 8 * * 1,2,5'
  # Allows manual triggering from the GitHub web UI or mobile app anytime
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch and process standings
        env:
          SPORTSDATA_KEY: ${{ secrets.SPORTSDATA_KEY }}
        run: |
          chmod +x update_standings.sh
          ./update_standings.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nfl.js index.html 2026.html alarm2026.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated standings update" && git push)
