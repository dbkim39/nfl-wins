			warshWins += wins;
			warshGames += wins + losses + ties;
			warshFJ += ties;
			warshDiff += net;
		} else if (sweeris.indexOf(team) >= 0 ) {
			sweerisTbl += rowData;
			sweerisWins += wins;
			sweerisGames += wins + losses + ties;
			sweerisFJ += ties;
			sweerisDiff += net;
		} else if (undrafted.indexOf(team) >= 0 ) {
			undraftedTbl += rowData;
			undraftedWins += wins;
			undraftedGames += wins + losses + ties;
			undraftedFJ += ties;
			undraftedDiff += net;
		}
    });
    kriegTbl += '<td class="textcol"><strong>Total Wins: '+kriegWins+' ('+kriegGames+')<br />Differential: '+kriegDiff+'<br />Footjobs: '+kriegFJ+ '</strong></td></tr>';
    doeTbl += '<td class="textcol"><strong>Total Wins: ' + doeWins + ' (' + doeGames +')<br />Differential: '+doeDiff+'<br />Footjobs: '+doeFJ+ '</strong></td></tr>';
    mersTbl += '<td class="textcol"><strong>Total Wins: ' + mersWins + ' (' + mersGames +')<br />Differential: '+mersDiff+'<br />Footjobs: '+mersFJ+ '</strong></td></tr>';
    nateTbl += '<td class="textcol"><strong>Total Wins: ' + nateWins + ' (' + nateGames +')<br />Differential: '+nateDiff+'<br />Footjobs: '+nateFJ+ '</strong></td></tr>';
    marshTbl += '<td class="textcol"><strong>Total Wins: ' + marshWins + ' (' + marshGames +')<br />Differential: '+marshDiff+'<br />Footjobs: '+marshFJ+ '</strong></td></tr>';
    klimmerTbl += '<td class="textcol"><strong>Total Wins: ' + klimmerWins + ' (' + klimmerGames +')<br />Differential: '+klimmerDiff+'<br />Footjobs: '+klimmerFJ+ '</strong></td></tr>';
    asburyTbl += '<td class="textcol"><strong>Total Wins: ' + asburyWins + ' (' + asburyGames +')<br />Differential: '+asburyDiff+'<br />Footjobs: '+asburyFJ+ '</strong></td></tr>';
    ajTbl += '<td class="textcol"><strong>Total Wins: ' + ajWins + ' (' + ajGames +')<br />Differential: '+ajDiff+'<br />Footjobs: '+ajFJ+ '</strong></td></tr>';
    warshTbl += '<td class="textcol"><strong>Total Wins: ' + warshWins + ' (' + warshGames +')<br />Differential: '+warshDiff+'<br />Footjobs: '+warshFJ+ '</strong></td></tr>';
    sweerisTbl += '<td class="textcol"><strong>Total Wins: ' + sweerisWins + ' (' + sweerisGames +')<br />Differential: '+sweerisDiff+'<br />Footjobs: '+sweerisFJ+ '</strong></td></tr>';
    undraftedTbl += '<td></td><td class="textcol"><strong>Total Wins: ' + undraftedWins + ' (' + undraftedGames +')<br />Differential: '+undraftedDiff+'<br />Footjobs: '+undraftedFJ+ '</strong></td></tr>';
    var winsArr = [
        {wins: kriegWins, diff: kriegDiff, ties: kriegFJ, table: kriegTbl},
        {wins: doeWins, diff: doeDiff, ties: doeFJ, table: doeTbl},
        {wins: mersWins, diff: mersDiff, ties: mersFJ, table: mersTbl},
        {wins: nateWins, diff: nateDiff, ties: nateFJ, table: nateTbl},
        {wins: marshWins, diff: marshDiff, ties: marshFJ, table: marshTbl},
        {wins: klimmerWins, diff: klimmerDiff, ties: klimmerFJ, table: klimmerTbl},
        {wins: asburyWins, diff: asburyDiff, ties: asburyFJ, table: asburyTbl},
        {wins: ajWins, diff: ajDiff, ties: ajFJ, table: ajTbl},
        {wins: warshWins, diff: warshDiff, ties: warshFJ, table: warshTbl},
        {wins: sweerisWins, diff: sweerisDiff, ties: sweerisFJ, table: sweerisTbl}
        ];
    winsArr.sort(function(a,b) {
		if (a.wins < b.wins) return 1;
		if (a.wins > b.wins) return -1;
		if (a.diff < b.diff) return 1;
		if (a.diff > b.diff) return -1;
		if (a.ties < b.ties) return 1;
		if (a.ties > b.ties) return -1;
    });
    $.each(winsArr, function() {
        main += this.table;
    });
	main += undraftedTbl;
    main += '</table>';
    document.getElementById("datalist").innerHTML = main;
});
