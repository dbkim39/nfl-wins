    jwTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + jwWins + ' (' + jwGames +')</strong></td></tr></tbody></table></td>';
    sweerisTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + sweerisWins + ' (' + sweerisGames +')</strong></td></tr></tbody></table></td>';
    undraftedTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + undraftedWins + ' (' + undraftedGames +')</strong></td></tr></tbody></table></td>';
    var winsArr = [
        {wins: kriegWins, table: kriegTbl, team: 'Krieg'},
        {wins: doeWins, table: doeTbl, team: 'Double Ds'},
        {wins: mersWins, table: mersTbl, team: 'Mers'},
        {wins: nateWins, table: nateTbl, team: 'Nate/Jordo'},
        {wins: jacobsWins, table: jacobsTbl, team: 'Jacobs'},
        {wins: klimmerWins, table: klimmerTbl, team: 'Klimmer/Straffi'},
        {wins: asburyWins, table: asburyTbl, team: 'Asbury/McCain'},
        {wins: ajWins, table: ajTbl, team: 'AJ/Holmberg'},
        {wins: jwWins, table: jwTbl, team: 'Warshauer'},
        {wins: sweerisWins, table: sweerisTbl, team: 'Sweeris'},
        {wins: undraftedWins, table: undraftedTbl, team: 'Undrafted'}
        ];
    winsArr.sort(function(a,b) {
        return b.wins - a.wins;
    });
    thead = '<thead>';
    $.each(winsArr, function() {
        main += this.table;
        thead += '<th>' + this.team + '</th>';
    });
    main += '</tr>' + thead + '</th></table>';
    document.getElementById("datalist").innerHTML = main;
});
