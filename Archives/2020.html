    doeTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + doeWins + ' (' + doeGames +')<br />Differential: '+doeDiff+'<br />Footjobs: '+doeFJ+ '</strong></td></tr></tbody></table></td>';
    mersTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + mersWins + ' (' + mersGames +')<br />Differential: '+mersDiff+'<br />Footjobs: '+mersFJ+ '</strong></td></tr></tbody></table></td>';
    nateTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + nateWins + ' (' + nateGames +')<br />Differential: '+nateDiff+'<br />Footjobs: '+nateFJ+ '</strong></td></tr></tbody></table></td>';
    jacobsTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + jacobsWins + ' (' + jacobsGames +')<br />Differential: '+jacobsDiff+'<br />Footjobs: '+jacobsFJ+ '</strong></td></tr></tbody></table></td>';
    klimmerTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + klimmerWins + ' (' + klimmerGames +')<br />Differential: '+klimmerDiff+'<br />Footjobs: '+klimmerFJ+ '</strong></td></tr></tbody></table></td>';
    asburyTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + asburyWins + ' (' + asburyGames +')<br />Differential: '+asburyDiff+'<br />Footjobs: '+asburyFJ+ '</strong></td></tr></tbody></table></td>';
    ajTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + ajWins + ' (' + ajGames +')<br />Differential: '+ajDiff+'<br />Footjobs: '+ajFJ+ '</strong></td></tr></tbody></table></td>';
    jwTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + jwWins + ' (' + jwGames +')<br />Differential: '+jwDiff+'<br />Footjobs: '+jwFJ+ '</strong></td></tr></tbody></table></td>';
    sweerisTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + sweerisWins + ' (' + sweerisGames +')<br />Differential: '+sweerisDiff+'<br />Footjobs: '+sweerisFJ+ '</strong></td></tr></tbody></table></td>';
    undraftedTbl += '<tr><td colspan=2 align=center><strong>Total Wins: ' + undraftedWins + ' (' + undraftedGames +')<br />Differential: '+undraftedDiff+'<br />Footjobs: '+undraftedFJ+ '</strong></td></tr></tbody></table></td>';
    var winsArr = [
        {wins: kriegWins, diff: kriegDiff, ties: kriegFJ, table: kriegTbl, team: 'Krieg'},
        {wins: doeWins, diff: doeDiff, ties: doeFJ, table: doeTbl, team: 'Double Ds'},
        {wins: mersWins, diff: mersDiff, ties: mersFJ, table: mersTbl, team: 'Mers'},
        {wins: nateWins, diff: nateDiff, ties: nateFJ, table: nateTbl, team: 'Nate/Jordo'},
        {wins: jacobsWins, diff: jacobsDiff, ties: jacobsFJ, table: jacobsTbl, team: 'Jacobs'},
        {wins: klimmerWins, diff: klimmerDiff, ties: klimmerFJ, table: klimmerTbl, team: 'Klimmer/Straffi'},
        {wins: asburyWins, diff: asburyDiff, ties: asburyFJ, table: asburyTbl, team: 'Asbury/McCain'},
        {wins: ajWins, diff: ajDiff, ties: ajFJ, table: ajTbl, team: 'AJ/Holmberg'},
        {wins: jwWins, diff: jwDiff, ties: jwFJ, table: jwTbl, team: 'Warshauer'},
        {wins: sweerisWins, diff: sweerisDiff, ties: sweerisFJ, table: sweerisTbl, team: 'Sweeris'}
        ];
    winsArr.sort(function(a,b) {
		if (a.wins < b.wins) return 1;
		if (a.wins > b.wins) return -1;
		if (a.diff < b.diff) return 1;
		if (a.diff > b.diff) return -1;
		if (a.ties < b.ties) return 1;
		if (a.ties > b.ties) return -1;
    });
    thead = '<thead>';
    $.each(winsArr, function() {
        main += this.table;
        thead += '<th>' + this.team + '</th>';
    });
	main += undraftedTbl;
	thead += '<th>Undrafted</th>';
    main += '</tr>' + thead + '</th></table>';
    document.getElementById("datalist").innerHTML = main;
});
</script>
